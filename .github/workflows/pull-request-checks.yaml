name: pull-request-check

on:
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  pull-request-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma Generate (back)
        id: prisma-generate-back
        run: pnpm --filter @flex/back exec prisma generate

      - name: Prisma Generate (provider)
        id: prisma-generate-provider
        run: pnpm --filter @flex/provider exec prisma generate

      - name: Build shared
        id: build-shared
        run: pnpm run build:shared

      - name: Run linter
        id: lint
        run: pnpm run lint
        continue-on-error: true

      - name: Type and lint checks
        id: check
        run: pnpm run check

      - uses: peter-evans/create-or-update-comment@v4
        if: failure() && steps.check.outcome == 'failure'
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## Errors detected
            Errors require manual fixes, make a new commit to make you PR mergeable.
            You'll see errors by running :
            ```bash
            # Auto fix lint errors you may have
            pnpm run lint

            # Checks for errors needing manual intervention
            pnpm run check
            ```
            Commit the changes and push to make this PR mergeable.

      - name: Diff check after lint
        id: diff
        run: git diff --exit-code

      - uses: peter-evans/create-or-update-comment@v4
        if: failure() && steps.diff.outcome == 'failure'
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## Lint errors detected
            Some issues were found but can be **automatically fixed** by running:
            ```bash
            pnpm run lint
            ```
            Commit the changes and push to make this PR mergeable.

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: back, dockerfile: back/Dockerfile }
          - { name: provider, dockerfile: provider/Dockerfile }
          - { name: front, dockerfile: front/Dockerfile }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

  docker-stack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare secrets and environment
        run: |
          make secrets-server
          echo -n ci > secrets/smtp_pass
          echo -n ci > secrets/api42_client_secret
          cat > .env <<EOF
          FRONT_PORT=8443
          FRONT_HTTP_PORT=8080
          POSTGRES_USER=flex
          POSTGRES_DB=flex
          BASE_FRONT_URL=https://localhost:8443
          VITE_API_URL=/api
          VITE_DEFAULT_LANG=en
          ADMIN_EMAIL=admin@example.com
          SMTP_HOST=smtp.invalid
          SMTP_USER=ci
          API42_CLIENT_UID=ci
          EOF

      - name: Start the server stack
        run: docker compose up -d --build --wait

      - name: Check the stack
        run: |
          curl --fail --silent --insecure https://localhost:8443/api/health
          curl --silent --output /dev/null --write-out '%{http_code} %{redirect_url}\n' http://localhost:8080/ | grep '^301 https://localhost:8443/'
          curl --fail --silent --insecure --output /dev/null https://localhost:8443/

      - name: Logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v
