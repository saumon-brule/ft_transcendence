name: flex-provider

x-provider-build: &provider-build
  context: ..
  dockerfile: provider/Dockerfile

x-hardened: &hardened
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  read_only: true
  tmpfs: [/tmp]

services:
  postgres:
    <<: *hardened
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    tmpfs: [/tmp, /run/postgresql]
    image: paradedb/paradedb:0.26.3-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [db]

  migrate:
    <<: *hardened
    build: *provider-build
    image: flex-provider
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
    networks: [db]

  provider:
    <<: *hardened
    build: *provider-build
    image: flex-provider
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: prod
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      FLEX_SERVER_URL: ${FLEX_SERVER_URL:?set FLEX_SERVER_URL in .env}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      FLEX_API_KEY_FILE: /run/secrets/flex_api_key
      NODE_EXTRA_CA_CERTS: /run/secrets/server_ca
    secrets:
      - postgres_password
      - flex_api_key
      - server_ca
    extra_hosts:
      - "host.docker.internal:${HOST_GATEWAY:-host-gateway}"
    volumes:
      - media:/data/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [db, web]

  proxy:
    <<: *hardened
    tmpfs: [/tmp, "/etc/nginx/conf.d:uid=101,gid=101"]
    image: nginxinc/nginx-unprivileged:stable-alpine
    restart: unless-stopped
    ports:
      - "${PROVIDER_HTTP_PORT:-80}:80"
      - "${PROVIDER_PORT:-443}:443"
    environment:
      PROVIDER_URL: ${PROVIDER_URL:?set PROVIDER_URL in .env}
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    secrets:
      - tls_cert
      - tls_key
    depends_on:
      provider:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://127.0.0.1:443/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [web]

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  flex_api_key:
    file: ./secrets/flex_api_key
  server_ca:
    file: ./secrets/server_ca.crt
  tls_cert:
    file: ./secrets/tls.crt
  tls_key:
    file: ./secrets/tls.key

networks:
  db:
    internal: true
  web:

volumes:
  postgres_data:
  media:
